<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chobi</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/js/neutralino.js" defer></script>
    <script src="/js/fabric.min.js" defer></script>
    <script src="/js/app.js" defer></script>
    <script src="/js/main.js" defer></script>
  </head>
  <body>
      <header>
        <nav>
          <div class="menu">
          <button class="menu-button">
            Layer
          </button>
          <div class="dropdown">
            <button id="bring-forward-tool" onclick="bringForwardTool()">
              Forward Layer
            </button>
            <button id="send-backward-tool" onclick="sendBackwardTool()">
              Backward Layer
            </button>
          </div>
        </div>
        <div class="menu">
          <button class="menu-button">
            Edit
          </button>
          <div class="dropdown">
            <button onclick="undoTool()">
              Undo
            </button>
            <button onclick="redoTool()">
              Redo
            </button>
          </div>
        </div>
        </nav>
      </header>
      <main>
          <aside id="left-sidebar">
            <button id="selection-tool" class="tool-icon" onclick="selectionTool()" title="Selection Tool">
                <img class="icon" src="/icons/tools/select.svg">
            </button>
            <button id="draw-tool" class="tool-icon" onclick="drawTool()" title="Brush">
                <img class="icon" src="/icons/tools/draw.svg">
            </button>
            <button id="eraser-tool" class="tool-icon" onclick="" title="Eraser">
                <img class="icon" src="/icons/tools/eraser.svg">
            </button>
            <button id="fill-tool" class="tool-icon" onclick="" title="Paint Bucket">
                <img class="icon" src="/icons/tools/fill.svg">
            </button>
            <button id="text-tool" class="tool-icon" onclick="" title="Add Text">
                <img class="icon" src="/icons/tools/text.svg">
            </button>
          </aside>
          <div id="middle-area">
              <canvas id="photo-area"></canvas>
          </div>
          <aside id="right-sidebar">
          </aside>
      </main>
  </body>
</html>
