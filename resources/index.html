<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chobi</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/js/neutralino.js" defer></script>
    <script src="/js/fabric.min.js" defer></script>
    <script src="/js/app.js" defer></script>
    <script src="/js/main.js" defer></script>
  </head>
  <body>
      <header>
          <nav>
              <div class="menu">
                  <button class="menu-button">
                      File
                  </button>
                  <div class="dropdown">
                      <button onclick="createNew()">
                          Create New
                      </button>
                      <button onclick="openExistingImage()">
                          Import
                      </button>
                  </div>
                </div>
                <div style="margin-left:auto;">
                    <button class="pbutton" onclick="exportImage()">
                        Export
                    </button>
              </div>
          </nav>
      </header>
      <div id="setup">
          <div id="setup-top">
              <h1>Chobi</h1>
          </div>
          <div id="setup-bottom">
            <button class="pbutton" onclick="createImage()">+ Create New</button>
            <button class="sbutton" onclick="openExistingImage()">Open Existing</button>
          </div>
      </div>
      <main>
          <div id="left-sidebar">
            <div id="lsidebar-header">
                <h4 id="lheader-title">Tools</h4>
            </div>
            <button id="selection-tool" class="tool-icon" onclick="selectionTool()" title="Selection Tool">
                <img class="icon" src="/icons/tools/select.svg">
            </button>
            <button id="pencil-tool" class="tool-icon" onclick="pencilTool()" title="Pencil">
                <img class="icon" src="/icons/tools/pencil.svg">
            </button>
            <button id="draw-tool" class="tool-icon" onclick="drawTool()" title="Brush">
                <img class="icon" src="/icons/tools/draw.svg">
            </button>
            <button id="fill-tool" class="tool-icon" onclick="fillTool()" title="Paint Bucket">
                <img class="icon" src="/icons/tools/fill.svg">
            </button>
            <button id="eraser-tool" class="tool-icon" onclick="eraserTool()" title="Eraser">
                <img class="icon" src="/icons/tools/eraser.svg">
            </button>
            <button id="text-tool" class="tool-icon" onclick="textTool()" title="Textbox">
                <img class="icon" src="/icons/tools/text.svg">
            </button>
            <button id="shapes-tool" class="tool-icon" onclick="shapesTool()" title="Shapes">
                <img class="icon" src="/icons/tools/shapes.svg">
            </button>
            <button id="crop-tool" class="tool-icon" onclick="cropTool()" title="Crop">
                <img class="icon" src="/icons/tools/crop.svg">
            </button>
            <button id="filter-tool" class="tool-icon" onclick="filterTool()" title="Color Filters">
                <img class="icon" src="/icons/tools/filters.svg">
            </button>
          </div>
          <div id="middle-area">
              <canvas id="whiteboard"></canvas>
          </div>
          <div id="right-sidebar">
              <div id="sidebar-header">
                  <h1 id="header-title">Properties</h1>
              </div>
              <div id="sidebar-contents">
                  <div id="canvas-props" class="prop-section">
                      <div class="section-title">Whiteboard</div>
                      <div class="prop-row">
                          <label for="canvas-bg">Background Color:</label>
                          <input type="color" id="canvas-bg" value="#ffffff" />
                      </div>
                      <div class="prop-row" style="margin-top: 8px;">
                          <button onclick="clearCanvas()" class="sbutton" style="width: 100%; margin-left: 0;">Clear board</button>
                      </div>
                  </div>
                  <div id="selection-props" class="prop-section">
                      <div class="section-title">Transform</div>
                          <div class="prop-row">
                              <label for="obj-x">Pos-X:</label>
                              <input type="number" id="obj-x" />
                          </div>
                          <div class="prop-row">
                              <label for="obj-y">Pos-Y:</label>
                              <input type="number" id="obj-y" />
                          </div>
                          <div class="prop-row">
                              <label for="obj-w">Width:</label>
                              <input type="number" id="obj-w" />
                          </div>
                          <div class="prop-row">
                              <label for="obj-h">Height:</label>
                              <input type="number" id="obj-h" />
                          </div>
                  </div>
                  <div id="pencil-props" class="prop-section">
                      <div class="section-title">Pencil</div>
                      <div class="prop-row">
                          <label for="stroke-color">Color:</label>
                          <input type="color" id="stroke-color" value="#000000" />
                      </div>
                      <div class="prop-row">
                          <label for="stroke-size">Pencil Size:</label>
                          <input type="number" id="stroke-size" min="1" max="100" value="5" />
                      </div>
                  </div>
                  <div id="brush-props" class="prop-section">
                      <div class="section-title">Brush</div>
                      <div class="prop-row">
                          <label for="brush-color">Color:</label>
                          <input type="color" id="brush-color" value="#000000" />
                      </div>
                      <div class="prop-row">
                          <label for="brush-size">Brush Size:</label>
                          <input type="number" id="brush-size" min="1" max="100" value="5" />
                      </div>
                      <div class="prop-row">
                          <label for="brush-type">Brush Type:</label>
                          <select id="brush-type">
                              <option>Bubble</option>
                              <option>Spray</option>
                          </select>
                      </div>
                  </div>
                  <div id="fill-props" class="prop-section">
                      <div class="section-title">Paint Bucket</div>
                      <div class="prop-row">
                          <label for="fill-color">Fill Color:</label>
                          <input type="color" id="fill-color" value="#000000" />
                      </div>
                  </div>
                  <div id="eraser-props" class="prop-section">
                      <div class="section-title">Eraser</div>
                      <div class="prop-row">
                          <label for="eraser-size">Eraser Size:</label>
                          <input type="number" id="eraser-size" min="1" max="100" value="5" />
                      </div>
                  </div>
                  <div id="textbox-props" class="prop-section">
                      <div class="section-title">Textbox</div>
                      <div class="prop-row">
                          <label for="text-color">Text Color:</label>
                          <input type="color" id="text-color" value="#000000" />
                      </div>
                      <div class="prop-row">
                          <label for="bg-color">Background Color:</label>
                          <input type="color" id="bg-color" value="#ffffff" />
                      </div>
                      <div class="prop-row">
                          <label for="text-size">Text Size:</label>
                          <input type="number" id="text-size" min="1" max="100" value="24" />
                      </div>
                      <div class="prop-row">
                          <label for="text-align">Text Alignment:</label>
                          <select id="text-align">
                              <option>left</option>
                              <option>center</option>
                              <option>right</option>
                              <option>justify</option>
                              <option>justify-left</option>
                              <option>justify-center</option>
                              <option>justify-right</option>
                          </select>
                      </div>
                      <div class="prop-row" style="margin-top: 8px;">
                          <button onclick="addText()" class="sbutton" style="width: 100%; margin-left: 0;">Add Text</button>
                      </div>
                 </div>
                 <div id="shapes-props" class="prop-section">
                     <div class="section-title">Shapes</div>
                     <div class="prop-row">
                         <label for="shape-type">Shape Type:</label>
                         <select id="shape-type">
                             <option value="rect">Rectangle</option>
                             <option value="circle">Circle</option>
                             <option value="triangle">Triangle</option>
                         </select>
                     </div>
                     <div class="prop-row">
                         <label for="shape-fill">Fill Color:</label>
                         <input type="color" id="shape-fill" value="#A5D0A8" />
                     </div>
                     <div class="prop-row">
                         <label for="shape-stroke">Stroke Color:</label>
                         <input type="color" id="shape-stroke" value="#F2CD5D" />
                     </div>
                     <div class="prop-row">
                         <label for="shape-stroke-width">Stroke Width:</label>
                         <input type="number" id="shape-stroke-width" min="0" max="50" value="2" />
                     </div>
                     <div class="prop-row" style="margin-top: 8px;">
                         <button onclick="addShape()" class="sbutton" style="width: 100%; margin-left: 0;">Add Shape</button>
                     </div>
                 </div>
                 <div id="crop-props" class="prop-section">
                     <div class="section-title">Crop</div>
                     <div class="prop-row" style="margin-top: 8px;">
                         <button onclick="applyCrop()" class="pbutton" style="width: 100%; margin-left: 0;">Apply Crop</button>
                     </div>
                     <div class="prop-row" style="margin-top: 8px;">
                         <button onclick="cancelCrop(true)" class="sbutton" style="width: 100%; margin-left: 0;">Cancel</button>
                     </div>
                 </div>
              </div>
          </div>
      </main>
  </body>
</html>
